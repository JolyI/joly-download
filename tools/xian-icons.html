<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>印章与图标定版</title>
<style>
:root { --ground:#eef3f7; --ink:#1a1f2b; --ink-2:#5b6b82; --ink-3:#97a4b6;
  --line:rgba(26,31,43,.09); --spirit:#2fb8b0; --cinnabar:#b8462f; }
* { box-sizing:border-box; }
body { margin:0; padding:26px 30px 34px; background:#e9ecef; color:var(--ink);
  font:13px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif; -webkit-font-smoothing:antialiased; }
h2 { font-size:12px; font-weight:800; letter-spacing:2.5px; color:#7d8a9c; margin:0 0 16px;
     padding-bottom:8px; border-bottom:1px solid #d5dbe3; }
h2:not(:first-child) { margin-top:34px; }
.sprite { position:absolute; width:0; height:0; }
.ic { width:15px; height:15px; display:block; }

.seals { display:grid; grid-template-columns:repeat(3,286px); gap:16px 20px; }
.scard { }
.mini { display:flex; align-items:baseline; gap:8px; padding:12px 14px 14px; background:var(--ground);
  border:1px solid #dbe1e8; border-radius:9px; overflow:hidden; }
.mt { font-size:18px; font-weight:800; letter-spacing:3px; }
.ms { align-self:center; width:16px; height:16px; border-radius:3px; background:var(--cinnabar); color:#fff;
  font-size:9.5px; font-weight:700; display:flex; align-items:center; justify-content:center; flex:none; }
.mv { font-size:9.5px; color:var(--ink-3); }
.msp { flex:1; min-width:6px; }
.ma { font-size:10.5px; color:var(--ink-2); white-space:nowrap; }
.ma.on { color:var(--cinnabar); font-weight:700; }
.sl { padding:8px 2px 0; display:flex; align-items:baseline; gap:8px; }
.sl b { font-size:12px; font-weight:700; }
.sl span { font-size:11px; color:#8b97a8; }

.icons { display:flex; gap:14px; flex-wrap:wrap; }
.icell { width:96px; display:flex; flex-direction:column; align-items:center; gap:7px;
  padding:15px 6px 11px; background:var(--ground); border:1px solid #dbe1e8; border-radius:10px; }
.ring { position:relative; width:30px; height:30px; border-radius:50%; flex:none;
  display:flex; align-items:center; justify-content:center;
  background:conic-gradient(from -90deg, var(--spirit) calc(var(--p,.45)*1turn), var(--line) 0); }
.ring::before { content:""; position:absolute; inset:2px; border-radius:50%; background:var(--ground); }
.ring .ic { position:relative; z-index:1; color:var(--ink-2); }
.icell b { font-size:10.5px; font-weight:700; }
</style>
</head><body>

<symbol id="i-image" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 4.4v15.2M18.5 4.4v15.2"/><rect x="5.5" y="7" width="13" height="10" rx="1.3"/><circle cx="12" cy="12" r="2.2"/></g></symbol>

<symbol id="i-audio" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.2v2.6"/><path d="M8.5 17.4V11a3.5 3.5 0 0 1 7 0v6.4z"/><path d="M7 17.4h10"/></g></symbol>
<symbol id="i-archive" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9.2 8.3C6.3 9.9 4.6 12.5 4.6 15.2a4.6 4.6 0 0 0 4.6 4.6h5.6a4.6 4.6 0 0 0 4.6-4.6c0-2.7-1.7-5.3-4.6-6.9z"/><path d="M9.2 8.3V6.7A2.8 2.8 0 0 1 12 3.9a2.8 2.8 0 0 1 2.8 2.8v1.6"/><path d="M9.4 8.3h5.2" opacity=".5"/></g></symbol>
<symbol id="i-app" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.2L20 12l-8 8.8L4 12z"/><path d="M12 8.1l3.9 3.9-3.9 3.9-3.9-3.9z" opacity=".5"/></g></symbol></svg>
