.bar svg{width:15px;height:15px;display:block}

.hero .niche{position:relative;overflow:hidden;flex:none;width:62px;height:74px;border-radius:31px 31px 8px 8px;

.hero .niche::before{content:"";position:absolute;inset:0;top:auto;height:100%;
 background:linear-gradient(180deg,#f6e7b6,#cfa63a);transform:scaleY(.45);transform-origin:bottom}

.hero .info{min-width:0;flex:1}

.hero .nm{font-size:16px;font-weight:800;line-height:1.3;margin:3px 0 0;word-break:break-all}
.hero .src{font-size:11.5px;color:#8b7a60;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero .big{display:flex;align-items:baseline;gap:8px;margin-top:9px}
.hero .big em{font-style:normal;font-size:30px;font-weight:800;letter-spacing:-1px;color:var(--ink);line-height:1}
.hero .big span{font-size:11.5px;font-weight:700;color:var(--jade)}
.hero .eta{font-size:11px;color:#8b7a60;margin-top:3px}

.gp{margin:18px 13px 7px;font-size:10.5px;font-weight:800;letter-spacing:3px;color:#9a8563}
.row{display:flex;align-items:center;gap:10px;padding:8px 13px;border-top:1px solid rgba(120,86,40,.13)}
.row .niche{position:relative;overflow:hidden;flex:none;width:26px;height:30px;border-radius:13px 13px 4px 4px;
 background:var(--sand2);display:flex;align-items:center;justify-content:center;color:#6b5840}
.row .niche::before{content:"";position:absolute;inset:0;top:auto;height:100%;background:#d9b455;
 transform:scaleY(var(--p,0));transform-origin:bottom}
.row .niche svg{position:relative;width:14px;height:14px;display:block}
.row .nm{flex:1;min-width:0;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t{font-size:11px;color:#9a8563;flex:none}
.row.d .nm{color:#8a3a24}
