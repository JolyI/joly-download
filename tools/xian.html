<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>修仙方向稿</title>
<style>
:root {
  color-scheme: light dark;
  --ground: #f2f5f9;   /* 月白 */
  --surface:#ffffff;
  --ink:    #1a1f2b;   /* 墨 */
  --ink-2:  #5b6b82;   /* 远山黛 */
  --ink-3:  #97a4b6;   /* 霜 */
  --line:   rgba(26,31,43,.09);
  --spirit: #2fb8b0;   /* 灵青 —— 唯一的亮色 */
  --glow:   rgba(47,184,176,.20);
  --gold:   #b08a34;   /* 流金 —— 只给"丹成" */
  --cinnabar:#b8462f;  /* 朱砂 */
}
@media (prefers-color-scheme: dark) {
  :root {
    --ground: #0b0e14;   /* 玄夜 */
    --surface:#141a26;
    --ink:    #e8eef7;
    --ink-2:  #93a3bb;
    --ink-3:  #5f6d84;
    --line:   rgba(232,238,247,.10);
    --spirit: #4fd8cf;
    --glow:   rgba(79,216,207,.22);
    --gold:   #d8b45e;
    --cinnabar:#e0664a;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; width: 380px; height: 560px; display: flex; flex-direction: column;
  overflow: hidden; background: var(--ground); color: var(--ink);
  font: 13px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", sans-serif;
  -webkit-font-smoothing: antialiased;
}
.sprite { position: absolute; width: 0; height: 0; }
.ic { width: 15px; height: 15px; display: block; }

/* ── 顶栏：不设色块，只有一道远山与一条发丝线 ── */
.top { position: relative; flex: none; padding: 16px 18px 22px; overflow: hidden; }
/* 远山分两层：近山实、远山虚，纵深来自明度差而不是描边 */
.top .shan {
  position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 40px;
  pointer-events: none;
}
.top .shan .far  { color: var(--ink); opacity: .055; }
.top .shan .near { color: var(--ink); opacity: .095; }
.top-in { position: relative; display: flex; align-items: baseline; gap: 9px; }
.title { margin: 0; font-size: 21px; font-weight: 800; letter-spacing: 4px; }
.seal {
  align-self: center; width: 17px; height: 17px; border-radius: 3px;
  background: var(--cinnabar); color: #fff; font-size: 10px; font-weight: 700;
  display: flex; align-items: center; justify-content: center; flex: none;
  opacity: .9;
}
.ver { font-size: 10px; font-weight: 600; color: var(--ink-3); letter-spacing: .5px; }
.acts { margin-left: auto; display: flex; align-items: center; gap: 4px; }
.act {
  appearance: none; font: inherit; font-size: 11px; font-weight: 500;
  color: var(--ink-2); background: transparent; border: 0;
  padding: 3px 7px; border-radius: 6px; cursor: pointer;
}
.act:hover { background: var(--line); color: var(--ink); }
.act.on { color: var(--cinnabar); font-weight: 700; }
.hair { height: 1px; background: var(--line); margin: 0 18px; }

/* ── 筛选：只有文字，选中才落墨 ── */
.tabs { flex: none; display: flex; gap: 18px; padding: 14px 18px 0; }
.tab {
  appearance: none; font: inherit; font-size: 12px; font-weight: 500;
  color: var(--ink-3); background: transparent; border: 0; padding: 0 0 5px;
  cursor: pointer; position: relative;
}
.tab.is-active { color: var(--ink); font-weight: 700; }
.tab.is-active::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px;
  background: var(--spirit); border-radius: 1px;
}

/* ── 搜索：发丝线输入，无框无影 ── */
.srch { flex: none; padding: 14px 18px 0; }
.srch input {
  width: 100%; appearance: none; font: inherit; font-size: 12px;
  color: var(--ink); background: transparent; border: 0;
  border-bottom: 1px solid var(--line); padding: 5px 0; outline: none;
}
.srch input::placeholder { color: var(--ink-3); }
.srch input:focus { border-bottom-color: var(--spirit); }

/* ── 列表 ── */
.list { flex: 1; overflow-y: auto; padding: 0 18px 16px; overscroll-behavior: contain; }
.list::-webkit-scrollbar { width: 8px; }
.list::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

/* ── 榜题：不落墨底，只一行字 + 一道渐隐横线 ── */
.gp { display: flex; align-items: center; gap: 9px; padding: 18px 0 8px; position: sticky; top: 0;
      background: var(--ground); z-index: 2; }
.gp b { font-size: 11px; font-weight: 700; letter-spacing: 2px; color: var(--ink-2); }
.gp i { font-size: 10px; font-style: normal; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.gp .rule { flex: 1; height: 1px; background: linear-gradient(90deg, var(--line), transparent); }

/* ── 灵环：一圈灵气顺时针充盈 ── */
.ring {
  position: relative; flex: none; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: conic-gradient(from -90deg, var(--spirit) calc(var(--p) * 1turn), var(--line) 0);
}
.ring::before { content: ""; position: absolute; inset: 2px; border-radius: 50%; background: var(--ground); }
/* 主角卡里的灵环内圈必须跟卡片同色，否则白卡上会浮出一个灰洞 */
.row.is-hero .ring::before { background: var(--surface); }
.ring .ic { position: relative; z-index: 1; color: var(--ink-2); }
.ring.r-sm { width: 30px; height: 30px; }
.ring.r-lg { width: 62px; height: 62px; }
.ring.r-lg::before { inset: 3px; }
.ring.r-lg .ic { width: 24px; height: 24px; }
/* 丹成：金环闭合 */
.ring.s-ok { background: conic-gradient(var(--gold) 1turn, var(--gold) 0); }
.ring.s-ok .ic { color: var(--gold); }
.ring.s-warn { background: conic-gradient(from -90deg, var(--ink-3) calc(var(--p) * 1turn), var(--line) 0); }
.ring.s-bad { background: conic-gradient(var(--cinnabar) 1turn, var(--cinnabar) 0); }
.ring.s-bad .ic { color: var(--cinnabar); }
/* 主修：灵气外溢 */
.ring.s-live { box-shadow: 0 0 0 4px var(--glow), 0 0 22px 2px var(--glow); }
.ring.s-live .ic { color: var(--spirit); }

/* ── 行：无框无影，只有一道发丝线分隔 ── */
.row {
  display: flex; align-items: center; gap: 13px;
  padding: 9px 0; border-bottom: 1px solid var(--line);
}
.row:last-child { border-bottom: 0; }
.row .nm {
  flex: 1; min-width: 0; margin: 0; font-size: 13px; font-weight: 500;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.row .tm { flex: none; font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; }

/* ── 主修卡：靠柔光浮起，不靠描边 ── */
.row.is-hero {
  display: flex; align-items: center; gap: 16px;
  margin: 6px 0 4px; padding: 16px 15px;
  border: 0; border-radius: 14px;
  background: var(--surface);
  box-shadow: 0 0 0 1px var(--line), 0 10px 34px -10px var(--glow), 0 3px 12px -5px rgba(20,30,50,.14);
}
.row.is-hero .hd { flex: 1; min-width: 0; }
.row.is-hero .nm {
  font-size: 14px; font-weight: 700; line-height: 1.35;
  white-space: normal; word-break: break-all;
}
.row.is-hero .sub {
  margin: 3px 0 0; font-size: 11px; color: var(--ink-3);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.row.is-hero .sub .dot {
  display: inline-block; width: 3px; height: 3px; border-radius: 50%;
  background: var(--ink-3); vertical-align: middle; margin: 0 6px; opacity: .6;
}
.row.is-hero .big { margin: 8px 0 0; display: flex; align-items: baseline; gap: 2px; }
.row.is-hero .big b { font-size: 32px; font-weight: 800; letter-spacing: -1.5px; line-height: 1; }
.row.is-hero .big i { font-size: 14px; font-weight: 700; font-style: normal; color: var(--ink-3); }
.row.is-hero .big em { font-size: 12px; font-style: normal; font-weight: 600; color: var(--spirit); margin-left: 8px; }
.row.is-hero .eta { margin: 3px 0 0; font-size: 11px; color: var(--ink-3); }
</style>
