<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><style>
:root{--ink:#1c1712;--red:#c8352a;--gold:#f0c14b;--jade:#1f8f6a;--blue:#1f5fa8;--paper:#f7f2e7}
*{box-sizing:border-box}
body{margin:0;width:380px;background:var(--paper);color:var(--ink);
 font:13px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;-webkit-font-smoothing:antialiased}

/* ── 顶栏 ── */
.top{position:relative;overflow:hidden;background:var(--red);padding:13px 14px 12px;border-bottom:3px solid var(--ink)}
.top::before{content:"";position:absolute;right:-40px;top:-50px;width:150px;height:150px;border-radius:50%;
 background:repeating-radial-gradient(circle at center,transparent 0 7px,rgba(240,193,75,.42) 7px 9px)}
.top::after{content:"";position:absolute;left:-24px;bottom:-36px;width:72px;height:72px;border-radius:50%;background:var(--gold);opacity:.28}
.t1{position:relative;display:flex;align-items:baseline;gap:8px}
.title{margin:0;font-size:24px;font-weight:900;letter-spacing:3px;color:var(--gold);text-shadow:3px 3px 0 var(--ink)}
.ver{font-size:10px;font-weight:800;color:var(--red);background:var(--gold);border:2px solid var(--ink);border-radius:4px;padding:0 5px}
.acts{position:relative;display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.chip{font-size:11px;font-weight:800;background:#fff;color:var(--ink);border:2px solid var(--ink);
 border-radius:999px;padding:2px 10px;box-shadow:2px 2px 0 var(--ink);display:inline-flex;align-items:center;gap:5px}
.chip.on{background:var(--ink);color:var(--gold)}
.chip svg{width:13px;height:13px;display:block}

/* ── 搜索：贴纸输入框 ── */
.search{margin:11px 14px 0;display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--ink);
 border-radius:9px;box-shadow:2px 2px 0 var(--ink);padding:6px 10px;color:#a89e90}
.search svg{width:15px;height:15px;flex:none;color:var(--ink)}
.search span{font-size:12px;font-weight:600}

/* ── 主角卡 ── */
.hero{margin:13px 14px 0;position:relative;background:#fff;border:2px solid var(--ink);border-radius:14px;
 box-shadow:4px 4px 0 var(--ink);padding:13px;display:flex;gap:13px;align-items:center}
.hero::after{content:"下 载 中";position:absolute;right:-2px;top:-2px;background:var(--blue);color:#fff;
 font-size:9.5px;font-weight:900;letter-spacing:1.5px;padding:2px 9px;border:2px solid var(--ink);border-radius:0 12px 0 10px}
.niche{position:relative;overflow:hidden;flex:none;width:58px;height:70px;border-radius:29px 29px 8px 8px;
 border:2px solid var(--ink);background:var(--paper);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.niche::before{content:"";position:absolute;inset:0;top:auto;height:100%;background:linear-gradient(180deg,#f7dc94,#d9a92e);
 transform:scaleY(var(--p,0));transform-origin:bottom}
.niche svg{position:relative;width:25px;height:25px;display:block}
.info{min-width:0;flex:1}
.nm{margin:0;font-size:14.5px;font-weight:900;line-height:1.3;word-break:break-all}
.src{font-size:11px;color:#8c8072;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.big{display:flex;align-items:baseline;gap:9px;margin-top:7px}
.big em{font-style:normal;font-size:30px;font-weight:900;letter-spacing:-1.5px;line-height:1}
.big span{font-size:12px;font-weight:900;color:var(--blue)}
.eta{font-size:11px;font-weight:600;color:#8c8072;margin-top:2px}

/* ── 榜题 ── */
.gp{margin:16px 14px 8px;display:inline-block;background:var(--ink);color:var(--gold);font-size:11px;
 font-weight:900;letter-spacing:2.5px;padding:3px 12px;border-radius:5px;box-shadow:2px 2px 0 var(--red)}

/* ── 其余下载：单行贴纸 ── */
.row{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--ink);border-radius:9px;
 box-shadow:2px 2px 0 var(--ink);margin:0 14px 7px;padding:6px 10px}
.niche.sm{width:27px;height:32px;border-radius:13px 13px 4px 4px}
.niche.sm svg{width:13px;height:13px}
.nm2{flex:1;min-width:0;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd{flex:none;font-size:10px;font-weight:900;color:#fff;background:var(--jade);border:2px solid var(--ink);
 border-radius:5px;padding:0 6px;letter-spacing:.5px}
.bd.d{background:var(--red)}.bd.w{background:#b8892b}
</style></head><body>

  </div>
</div>

  <span class="nm2">店铺后台批量导出exportChannel.xlsx</span><span class="bd">已完成</span></div>

  <span class="nm2">unknown-setup.dmg</span><span class="bd d">已拦截</span></div>

  <span class="nm2">ic_jump-link.svg</span><span class="bd">已完成</span></div>
<div class="row"><span class="niche sm" style="--p:.72"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg></span>
  <span class="nm2">source-code.zip</span><span class="bd w">已暂停</span></div>
