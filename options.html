<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Joly 下载 · 设置</title>
<style>
  :root {
    color-scheme: light dark;
    --paper: #f6f7f9;
    --card: #fcfcfd;
    --ink: #29313d;
    --ink-dim: #657181;
    --accent: #486c96;
    --accent-soft: #eaf0f7;
    --border: #dfe4eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #22262d;
      --card: #2b3038;
      --ink: #e1e5ec;
      --ink-dim: #a3adbb;
      --accent: #93b4df;
      --accent-soft: #354254;
      --border: #404853;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-width: 0;
    background: var(--paper);
    color: var(--ink);
    font: 13px/1.6 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--accent-soft); color: var(--ink); }

  .band {
    max-width: 600px;
    margin: 0 auto;
    padding: 40px 24px 0;
  }
  .band-in {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 4px 12px;
  }
  .band h1 {
    margin: 0;
    color: var(--ink);
    font-size: 22px;
    font-weight: 650;
    line-height: 1.35;
    letter-spacing: -0.3px;
  }
  .band .sub {
    font-size: 12px;
    color: var(--ink-dim);
  }

  main { max-width: 600px; margin: 0 auto; padding: 16px 24px 48px; }
  .lead { color: var(--ink-dim); margin: 0 0 24px; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
  }
  .item {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    gap: 20px;
    padding: 20px;
  }
  .item + .item { border-top: 1px solid var(--border); }
  .txt { min-width: 0; }
  .txt b { display: block; font-size: 13px; font-weight: 600; }
  .txt span { display: block; color: var(--ink-dim); font-size: 12px; margin-top: 4px; }

  select {
    font: inherit;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    min-width: 124px;
    max-width: 100%;
    min-height: 38px;
    cursor: pointer;
  }
  select:hover { border-color: var(--accent); }
  select:focus-visible,
  input[type="checkbox"]:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }
  input[type="checkbox"] {
    width: 18px;
    height: 18px;
    margin: 0;
    accent-color: var(--accent);
    cursor: pointer;
  }

  .hint { color: var(--ink-dim); font-size: 12px; margin: 12px 2px 0; min-height: 20px; }

  .about {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin: 24px 2px 0;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    color: var(--ink-dim);
    font-size: 12px;
  }
  .about .brand { font-weight: 600; font-size: 13px; color: var(--ink-dim); }
  .about .ver {
    color: var(--ink-dim);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 1px 6px;
    font-size: 11px;
    font-variant-numeric: tabular-nums;
  }
  .about .ver:empty { display: none; }

  @media (max-width: 480px) {
    .band { padding: 28px 16px 0; }
    main { padding: 16px 16px 32px; }
    .item { padding: 18px 16px; gap: 12px; }
    .item:has(select) { grid-template-columns: minmax(0, 1fr); }
    select { width: 100%; }
  }
</style>
</head>
<body>
<header class="band">
  <div class="band-in">
    <h1>Joly 下载</h1>
    <span class="sub">Chrome 下载管理扩展</span>
  </div>
</header>

<main>
  <p class="lead">所有设置即时保存，无需手动确认。</p>

  <div class="card">
    <div class="item">
      <div class="txt">
        <b id="groupModeLabel">列表分组方式</b>
        <span>弹出窗下载列表默认按什么维度分组</span>
      </div>
      <select id="groupMode" aria-labelledby="groupModeLabel">
        <option value="date">按日期</option>
        <option value="type">按类型</option>
        <option value="none">不分组</option>
      </select>
    </div>

    <div class="item">
      <div class="txt">
        <b id="listLimitLabel">列表最多显示条数</b>
        <span>数值越小内存占用越低，直接影响扩展的内存预算</span>
      </div>
      <select id="listLimit" aria-labelledby="listLimitLabel">
        <option value="100">100 条</option>
        <option value="200">200 条</option>
        <option value="500">500 条</option>
      </select>
    </div>

    <div class="item">
      <div class="txt">
        <b id="notifyOnCompleteLabel">下载完成通知</b>
        <span>文件下载完成后弹出系统通知；点击通知可在文件夹中定位该文件</span>
      </div>
      <input type="checkbox" id="notifyOnComplete" aria-labelledby="notifyOnCompleteLabel">
    </div>

    <div class="item">
      <div class="txt">
        <b id="notifyOnFailLabel">下载失败通知</b>
        <span>下载失败时弹出系统通知（自己主动取消的下载不会通知）</span>
      </div>
      <input type="checkbox" id="notifyOnFail" aria-labelledby="notifyOnFailLabel">
    </div>
  </div>

  <p class="hint" id="hint"></p>

  <footer class="about">
    <span class="brand">Joly 下载</span>
    <span class="ver" id="ver"></span>
  </footer>
</main>
<script src="options.js"></script>
</body>
</html>
