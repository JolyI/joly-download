<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Joly 下载 · 设置</title>
<style>
  /* 和弹出窗同一套「国潮」语言：中国红实块 + 贴纸卡片 + 硬偏移阴影 */
  :root {
    color-scheme: light dark;
    --paper:  #f7f2e7;
    --card:   #ffffff;
    --ink:    #1c1712;
    --ink-dim:#8c8072;
    --red:    #c8352a;
    --gold:   #f0c14b;
    --jade:   #1f8f6a;
    --rings: repeating-radial-gradient(circle at center,
              transparent 0 9px, rgba(240, 193, 75, 0.42) 9px 11px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper:  #17130f;
      --card:   #241d16;
      --ink:    #f2e9d6;
      --ink-dim:#ab9c84;
      --red:    #b8302a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--red); color: var(--gold); }

  /* 顶栏：和中国红实块同一条，同心圆藻井压右上角 */
  .band {
    position: relative;
    overflow: hidden;
    padding: 22px 24px 24px;
    background: var(--red);
    border-bottom: 3px solid var(--ink);
  }
  .band::before {
    content: "";
    position: absolute;
    right: -56px; top: -70px;
    width: 210px; height: 210px;
    border-radius: 50%;
    background: var(--rings);
  }
  .band::after {
    content: "";
    position: absolute;
    left: -30px; bottom: -46px;
    width: 96px; height: 96px;
    border-radius: 50%;
    background: var(--gold);
    opacity: 0.28;
  }
  .band-in {
    position: relative;
    max-width: 560px;
    margin: 0 auto;
    display: flex;
    align-items: baseline;
    gap: 9px;
  }
  .band h1 {
    margin: 0;
    font-size: 26px;
    font-weight: 900;
    letter-spacing: 3px;
    color: var(--gold);
    text-shadow: 3px 3px 0 #1c1712;
  }
  .band .sub {
    font-size: 12px;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.82);
  }

  main { max-width: 560px; margin: 0 auto; padding: 22px 24px 48px; }
  .lead { color: var(--ink-dim); font-size: 12px; font-weight: 600; margin: 0 0 20px; }

  .card {
    background: var(--card);
    border: 2px solid var(--ink);
    border-radius: 12px;
    box-shadow: 4px 4px 0 var(--ink);
    overflow: hidden;
  }
  @media (prefers-color-scheme: dark) {
    .card { box-shadow: 4px 4px 0 #000; }
    .band h1 { text-shadow: 3px 3px 0 #000; }
  }
  .item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 14px 16px;
  }
  .item + .item { border-top: 2px solid var(--ink); }
  .txt b { display: block; font-size: 13px; font-weight: 800; }
  .txt span { display: block; color: var(--ink-dim); font-size: 12px; margin-top: 3px; }

  select {
    appearance: none;
    font: inherit;
    font-size: 12px;
    font-weight: 700;
    color: var(--ink);
    background: var(--paper);
    border: 2px solid var(--ink);
    border-radius: 8px;
    padding: 5px 12px;
    min-width: 124px;
    box-shadow: 2px 2px 0 var(--ink);
    outline: none;
    cursor: pointer;
  }
  @media (prefers-color-scheme: dark) { select { box-shadow: 2px 2px 0 #000; } }
  select:focus { box-shadow: 2px 2px 0 var(--ink), 0 0 0 3px rgba(31, 95, 168, 0.25); }

  input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--red); flex: none; cursor: pointer; }

  .hint { color: var(--ink-dim); font-size: 12px; font-weight: 600; margin: 16px 2px 0; min-height: 18px; }

  .about {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin: 28px 2px 0;
    padding-top: 14px;
    border-top: 2px solid var(--ink);
    color: var(--ink-dim);
    font-size: 12px;
  }
  .about .brand { font-weight: 900; font-size: 13px; letter-spacing: 1px; color: var(--ink); }
  .about .ver {
    color: var(--gold);
    background: var(--red);
    border: 2px solid var(--ink);
    border-radius: 4px;
    padding: 0 5px;
    font-size: 10px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>
<header class="band">
  <div class="band-in">
    <h1>Joly 下载</h1>
    <span class="sub">Chrome 下载管理扩展</span>
  </div>
</header>

<main>
  <p class="lead">所有设置即时保存，无需手动确认。</p>

  <div class="card">
    <div class="item">
      <div class="txt">
        <b>列表分组方式</b>
        <span>弹出窗下载列表默认按什么维度分组</span>
      </div>
      <select id="groupMode">
        <option value="date">按日期</option>
        <option value="type">按类型</option>
        <option value="none">不分组</option>
      </select>
    </div>

    <div class="item">
      <div class="txt">
        <b>列表最多显示条数</b>
        <span>数值越小内存占用越低，直接影响扩展的内存预算</span>
      </div>
      <select id="listLimit">
        <option value="100">100 条</option>
        <option value="200">200 条</option>
        <option value="500">500 条</option>
      </select>
    </div>

    <div class="item">
      <div class="txt">
        <b>下载完成通知</b>
        <span>文件下载完成后弹出系统通知；点击通知可在文件夹中定位该文件</span>
      </div>
      <input type="checkbox" id="notifyOnComplete">
    </div>

    <div class="item">
      <div class="txt">
        <b>下载失败通知</b>
        <span>下载失败时弹出系统通知（自己主动取消的下载不会通知）</span>
      </div>
      <input type="checkbox" id="notifyOnFail">
    </div>
  </div>

  <p class="hint" id="hint"></p>

  <footer class="about">
    <span class="brand">Joly 下载</span>
    <span class="ver" id="ver"></span>
  </footer>
</main>
<script src="options.js"></script>
</body>
</html>
