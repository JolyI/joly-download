<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Joly 下载 · 设置</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --bg-sub: #f5f5f7;
    --text: #1d1d1f;
    --text-dim: #6e6e73;
    --border: rgba(0, 0, 0, 0.1);
    --accent: #0a6cff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e;
      --bg-sub: #2c2c2e;
      --text: #f2f2f7;
      --text-dim: #9d9da3;
      --border: rgba(255, 255, 255, 0.12);
      --accent: #0a84ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px 24px 48px;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: var(--text-dim); font-size: 12px; margin: 0 0 24px; }
  .card {
    background: var(--bg-sub);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 14px 16px;
  }
  .item + .item { border-top: 1px solid var(--border); }
  .txt b { display: block; font-size: 13px; font-weight: 600; }
  .txt span { display: block; color: var(--text-dim); font-size: 12px; margin-top: 3px; }
  select {
    font: inherit;
    font-size: 13px;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    min-width: 120px;
  }
  input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
  .hint { color: var(--text-dim); font-size: 12px; margin: 16px 2px 0; min-height: 18px; }
  .about {
    display: flex;
    align-items: baseline;
    gap: 6px;
    margin: 28px 2px 0;
    padding-top: 14px;
    border-top: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 12px;
  }
  .about .brand { font-weight: 600; color: var(--text); }
  .about .ver { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main>
  <h1>Joly 下载</h1>
  <p class="sub">Chrome 下载管理扩展 · 所有设置即时保存，无需手动确认。</p>

  <div class="card">
    <div class="item">
      <div class="txt">
        <b>列表分组方式</b>
        <span>弹出窗下载列表默认按什么维度分组</span>
      </div>
      <select id="groupMode">
        <option value="date">按日期</option>
        <option value="type">按类型</option>
        <option value="none">不分组</option>
      </select>
    </div>

    <div class="item">
      <div class="txt">
        <b>列表最多显示条数</b>
        <span>数值越小内存占用越低，直接影响扩展的内存预算</span>
      </div>
      <select id="listLimit">
        <option value="100">100 条</option>
        <option value="200">200 条</option>
        <option value="500">500 条</option>
      </select>
    </div>

    <div class="item">
      <div class="txt">
        <b>下载完成通知</b>
        <span>文件下载完成后弹出系统通知；点击通知可在文件夹中定位该文件</span>
      </div>
      <input type="checkbox" id="notifyOnComplete">
    </div>

    <div class="item">
      <div class="txt">
        <b>下载失败通知</b>
        <span>下载失败时弹出系统通知（自己主动取消的下载不会通知）</span>
      </div>
      <input type="checkbox" id="notifyOnFail">
    </div>
  </div>

  <p class="hint" id="hint"></p>

  <footer class="about">
    <span class="brand">Joly 下载</span>
    <span class="ver" id="ver"></span>
  </footer>
</main>
<script src="options.js"></script>
</body>
</html>
